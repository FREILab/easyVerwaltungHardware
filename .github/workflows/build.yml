name: PlatformIO Build RFIDBOX_PoC

on:
  push:
    paths:
      - 'firmware/projects/RFIDBOX_PoC/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'firmware/projects/RFIDBOX_PoC/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Reconstruct secret.h
        env:
          SECRET_DATA: ${{ secrets.MY_SECRET_3D_Printer_H }}
        run: |
          # Ordner erstellen, falls nicht vorhanden
          mkdir -p firmware/projects/RFIDBOX_PoC/include
          # Das Secret sicher in die Datei schreiben
          cat <<EOF > firmware/projects/RFIDBOX_PoC/include/secret.h
          $SECRET_DATA
          EOF

      - name: Run PlatformIO Build
        run: pio run -d firmware/projects/RFIDBOX_PoC

      - name: Upload Binary as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-rfidbox-firmware
          path: firmware/projects/RFIDBOX_PoC/.pio/build/esp32dev/firmware.bin