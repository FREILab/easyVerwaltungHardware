[platformio]
default_envs = lasersaur_usb
extra_configs = platformio.secrets.ini

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Ethernet2 @ ^1.0.0
    https://github.com/adafruit/Adafruit_MPL3115A2_Library.git
    https://github.com/adafruit/Adafruit_MCP9808_Library.git
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    jandrassy/ArduinoOTA @ ^1.1.1
    jandrassy/WiFiEspAT @ ^2.0.0

; ArduinoJson v5 ist als Headerdatei eingebunden (include/ArduinoJson-v5.13.0.h)
; Server-Adresse (IP oder Hostname) und Token kommen aus platformio.secrets.ini (nicht in Git).
build_flags =
    -DSERVER_IP=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"
    -DOTA_ENABLED=1
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_password}\"
    -DOTA_HOSTNAME=\"${secrets.ota_hostname}\"

[env:lasersaur_hmi_usb]
; Erstflash und Debugging per USB/Serial

[env:lasersaur_usb]
extends = env
; Erstflash und Debugging per USB/Serial

[env:lasersaur_ota]
extends = env
; OTA-Upload ueber Netzwerk (Host/IP aus secrets)
upload_protocol = custom
upload_port = lasersaur-hmi.local
extra_scripts = upload_ota.py
