[platformio]
default_envs = lasersaur_hmi_usb
extra_configs = platformio.secrets.ini

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Ethernet2 @ ^1.0.0
    https://github.com/adafruit/Adafruit_MPL3115A2_Library.git
    https://github.com/adafruit/Adafruit_MCP9808_Library.git
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ArduinoJson v5 ist als Headerdatei eingebunden (include/ArduinoJson-v5.13.0.h)
; Server-IP und Token kommen aus platformio.secrets.ini (nicht in Git).
build_flags =
    -DSERVER_HOST=\"${secrets.server_host}\"
    -DAUTH_TOKEN=\"${secrets.auth_token}\"

[env:lasersaur_hmi_usb]
; Erstflash und Debugging per USB/Serial
