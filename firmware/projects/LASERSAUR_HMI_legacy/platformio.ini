[platformio]
default_envs = sammelplatine_usb
extra_configs = platformio.secrets.ini

[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

lib_deps =
    arduino-libraries/Ethernet2 @ ^1.0.4
    adafruit/Adafruit MPL3115A2 Library @ ^1.2.4
    adafruit/Adafruit MCP9808 Library @ ^2.0.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ArduinoJson v5 ist als Headerdatei eingebunden (include/ArduinoJson-v5.13.0.h)
; Server-IP und Token kommen aus platformio.secrets.ini (nicht in Git).
build_flags =
    -DSERVER_HOST=\"${secrets.server_host}\"
    -DAUTH_TOKEN=\"${secrets.auth_token}\"

[env:sammelplatine_usb]
; Erstflash und Debugging per USB/Serial
