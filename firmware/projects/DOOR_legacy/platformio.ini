[platformio]
default_envs = door_01_usb
extra_configs = platformio.secrets.ini

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 9600

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    waspinator/AccelStepper @ ^1.64
    jandrassy/ArduinoOTA @ ^1.1.1

; WiFiS3 ist im renesas-ra Core enthalten.
; Credentials kommen aus platformio.secrets.ini (nicht in Git).
build_flags =
    -DSERVER_IP=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"
    -DMACHINE_ID=\"${secrets.machine_id}\"
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASS=\"${secrets.wifi_password}\"

[pair_door_01]
extends = env
build_flags =
    ${env.build_flags}
    -DMACHINE_NAME=\"tuer\"
    -DOTA_HOSTNAME=\"tuer-01\"

[pair_door_02]
extends = env
build_flags =
    ${env.build_flags}
    -DMACHINE_NAME=\"tuer\"
    -DOTA_HOSTNAME=\"tuer-02\"

[env:door_01_usb]
extends = pair_door_01

[env:door_02_usb]
extends = pair_door_02

[env:door_01_ota]
extends = pair_door_01
upload_protocol = custom
upload_port = ${secrets.ota_ip_door_01}
extra_scripts = upload_ota.py

[env:door_02_ota]
extends = pair_door_02
upload_protocol = custom
upload_port = tuer-02.local
extra_scripts = upload_ota.py
