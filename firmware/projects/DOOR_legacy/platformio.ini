[platformio]
default_envs = door_01_usb
extra_configs = platformio.secrets.ini

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    waspinator/AccelStepper @ ^1.64
    arduino-libraries/Ethernet @ ^2.0.2

; Server-IP und Token kommen aus platformio.secrets.ini (nicht in Git).
; Kein WiFi auf dem Uno – nur Ethernet, daher keine WLAN-Credentials.
build_flags =
    -DSERVER_IP=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"
    -DMACHINE_ID=\"${secrets.machine_id}\"

[pair_door_01]
extends = env
build_flags =
    ${env.build_flags}
    -DMACHINE_NAME=\"tuer\"

[pair_door_02]
extends = env
build_flags =
    ${env.build_flags}
    -DMACHINE_NAME=\"tuer\"

[env:door_01_usb]
extends = pair_door_01
; Erstes Flashen und Debugging per USB/Serial

[env:door_02_usb]
extends = pair_door_02
; Zweite Tür per USB/Serial

; Hinweis: OTA ist auf dem Arduino Uno nicht verfügbar.
; Für OTA → Hardware-Upgrade auf ESP32 erforderlich (Phase 2).
