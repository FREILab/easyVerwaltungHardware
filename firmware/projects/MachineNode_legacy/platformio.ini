[platformio]
default_envs = machine_dev_usb
extra_configs = platformio.secrets.ini

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_deps =
    adafruit/Adafruit PN532 @ ^1.3.0
    thijse/ArduinoLog @ ^1.1.1

build_flags =
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_password}\"
    -DSERVER_HOST=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"
    -DOTA_ENABLED=1

[auth_permanent]
extends = env
build_flags =
    ${env.build_flags}
    -DRFIDCARD_AUTH_CONST=true
    -DCONTINUOUS_SERVER_CHECK=false

[auth_onetime]
extends = env
build_flags =
    ${env.build_flags}
    -DRFIDCARD_AUTH_CONST=false
    -DCONTINUOUS_SERVER_CHECK=false

; Dev-Kit: ESP32-S3-WROOM-1-N16R8 mit angelöteten Pins
[machine_dev]
extends = auth_permanent
build_flags =
    ${auth_permanent.build_flags}
    -DMACHINE_NAME=\"machine-node\"
    -DMACHINE_ID=\"machine-node-dev\"
    -DOTA_HOSTNAME=\"machine-node-dev\"

[env:machine_dev_usb]
extends = machine_dev

[env:machine_dev_ota]
extends = machine_dev
upload_protocol = espota
upload_port = machine-node-dev.local

; Pro Geraete-Paar genau HIER den Auth-Typ waehlen:
; extends = auth_permanent  oder  extends = auth_onetime
