; ============================================================
; Mega2560 WiFi R3 — Lasersaur HMI Firmware
; Zwei Plattformen: ATmega2560 (Logik + I/O) + ESP8266 (WiFi-Modem)
;
; DIP-Schalter (Schalter 2 muss auf RXD3/TXD3 stehen!):
;   ATmega flashen (USB):  DIP 3+4 ON, Rest OFF
;   ESP flashen (USB):     DIP 5+6+7 ON, Rest OFF
;   Normal-Betrieb:        DIP 1+2+3+4 ON, Rest OFF
;     → Serial0=USB-Debug, Serial3=ESP-Kommunikation, kein Konflikt
; ============================================================

[platformio]
src_dir       = .
default_envs  = laser_hmi_atmega_usb
extra_configs = platformio.secrets.ini

; ─────────────────────────────────────────────────────────
; ATmega2560 Base — Gesamte HMI-Logik, Sensoren, Display
; ─────────────────────────────────────────────────────────
[env_base_atmega]
platform         = atmelavr
board            = megaatmega2560
framework        = arduino
build_src_filter = -<*> +<src_atmega/>
build_flags      = -Isrc_atmega
monitor_speed    = 115200
lib_deps =
    https://github.com/adafruit/Adafruit_MPL3115A2_Library.git
    https://github.com/adafruit/Adafruit_MCP9808_Library.git
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    ; ArduinoJson v5 als Header eingebunden (include/ArduinoJson-v5.13.0.h)

; ─────────────────────────────────────────────────────────
; ESP8266 Base — WiFi-Proxy, Telnet-Debug, OTA
; ─────────────────────────────────────────────────────────
[env_base_esp]
platform         = espressif8266
board            = esp12e
framework        = arduino
build_src_filter = -<*> +<src_esp/>
build_flags =
    -Isrc_esp
    -DSERVER_HOST=\"${secrets.server_host}\"
    -DAUTH_TOKEN=\"${secrets.auth_token}\"
monitor_speed    = 115200
lib_deps =
    jandrassy/TelnetStream @ ~1.2.0

; ─────────────────────────────────────────────────────────
; Konkrete Environments
; ─────────────────────────────────────────────────────────

; ATmega: per USB flashen (DIP 3+4 ON)
[env:laser_hmi_atmega_usb]
extends = env_base_atmega

; ESP8266: einmalig per USB (DIP 5+6+7 ON) — danach OTA
[env:laser_hmi_esp_usb]
extends       = env_base_esp
monitor_speed = 115200

; ESP8266: OTA via mDNS — kein DIP-Wechsel nötig
; Monitor via Telnet: pio device monitor -e laser_hmi_esp_ota
[env:laser_hmi_esp_ota]
extends         = env_base_esp
upload_protocol = espota
upload_port     = laser-hmi.local
monitor_port    = socket://laser-hmi.local:23
