[platformio]
default_envs = door_01_usb
extra_configs = platformio.secrets.ini

[env]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    waspinator/AccelStepper @ ^1.64
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DSERVER_HOST=\"${secrets.server_host}\"
    -DSERVICE_TOKEN=\"${secrets.service_token}\"
    -DMACHINE_ID=\"${secrets.machine_id}\"

[pair_door_01]
extends = env
build_flags =
    ${env.build_flags}
    -DMACHINE_NAME=\"tuer\"
    -DOTA_HOSTNAME=\"tuer-01\"

[env:door_01_usb]
extends = pair_door_01

[env:door_01_ota]
extends = pair_door_01
upload_protocol = arduino
upload_port = tuer-01.local
