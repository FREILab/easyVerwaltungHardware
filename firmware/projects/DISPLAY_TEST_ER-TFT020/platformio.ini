; Testaufbau ER-TFT020-3 (ST7789V2, 240x320) an NUCLEO-L433RC-P
; SPI2 auf den Arduino-Headern: D13=SCK, D11=MOSI, D10=CS, D9=RS/DC, D8=RESET

[env:nucleo_l433rc_p]
platform = ststm32
board = nucleo_l433rc_p
framework = arduino
upload_protocol = mbed
upload_port = /Volumes/NODE_L433RC
monitor_speed = 115200
build_flags = -I include
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.11.11
