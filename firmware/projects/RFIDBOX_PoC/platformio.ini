[platformio]
default_envs = rfidbox_usb
extra_configs = platformio.secrets.ini

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; gemeinsame Bibliotheken
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    thijse/ArduinoLog @ ^1.1.1

; Gemeinsame Runtime-Config via Build-Flags
; Server/Token/WLAN kommen global aus platformio.secrets.ini (nicht in Git).
build_flags =
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_password}\"
    -DSERVER_IP=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"

[auth_permanent]
extends = env
build_flags =
    ${env.build_flags}
    -DRFIDCARD_AUTH_CONST=true
    -DCONTINUOUS_SERVER_CHECK=true

[auth_onetime]
extends = env
build_flags =
    ${env.build_flags}
    -DRFIDCARD_AUTH_CONST=false
    -DCONTINUOUS_SERVER_CHECK=true

; Pro Geraete-Paar genau HIER den Auth-Typ waehlen:
; extends = auth_permanent  oder  extends = auth_onetime
[pair_rfidbox]
extends = auth_permanent
build_flags =
    ${auth_permanent.build_flags}
    -DMACHINE_NAME=\"lasercutterXTool\"
    -DMACHINE_ID=\"rfidbox-01\"
    -DOTA_HOSTNAME=\"rfidbox-01\"

[pair_laser_cutter]
extends = auth_permanent
build_flags =
    ${auth_permanent.build_flags}
    -DMACHINE_NAME=\"lasercutterXTool\"
    -DMACHINE_ID=\"lasercutterXTool\"
    -DOTA_HOSTNAME=\"laser-cutter-01\"

