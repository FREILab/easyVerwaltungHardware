; PlatformIO Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = ESP32 RFID Machine Access Control System
default_envs = esp32dev

[env:esp32dev]
; --- Hardware & Platform ---
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial Monitor Settings ---
monitor_speed = 115200
; Filter: 'time' adds timestamps, 'esp32_exception_decoder' clarifies crashes
monitor_filters = 
    esp32_exception_decoder
    time

; --- Library Management ---
; Specific versions are locked to ensure long-term build stability
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    thijse/ArduinoLog @ ^1.1.1

; --- Build Options ---
; Optional: Injects build flags. Useful for GitHub Actions to pass 
; secrets without having the physical secret.h file present.
build_flags = 
    -D CORE_DEBUG_LEVEL=3 ; 0: None, 1: Error, 2: Warn, 3: Info, 4: Debug, 5: Verbose
    ;-D VERSION=1.0.0