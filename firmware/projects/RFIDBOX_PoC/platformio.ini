[env:rfidbox_usb]
extends = pair_rfidbox
; Build ohne OTA Upload (USB/Serial)

[env:rfidbox_ota]
extends = pair_rfidbox
; Build mit OTA Upload ueber Netzwerk
upload_protocol = espota
upload_port = rfidbox-01.local
build_flags =
    ${pair_rfidbox.build_flags}
    -DOTA_ENABLED=1

