[platformio]
default_envs = MachineNode_1P

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    thijse/ArduinoLog @ ^1.1.1
    bblanchon/ArduinoJson @ ^7.0.0  ; Neu für saubere API-Kommunikation

; --- Gemeinsame Basis-Flags ---
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -I ../../../shared        ; Zugriff auf globale API-Konstanten

; --- Stufe 2: MachineNode 1-Phase (Sauberer Stand) ---
[env:MachineNode_1P]
build_flags = 
    ${env.build_flags}
    -D NODE_TYPE_1P
    -D NUM_PHASES=1

; --- Stufe 3: MachineNode 3-Phase (Abgeleitet) ---
[env:MachineNode_3P]
extends = env:MachineNode_1P   ; Erbt alle Einstellungen von 1P
build_flags = 
    ${env.build_flags}
    -D NODE_TYPE_3P
    -D NUM_PHASES=3            ; Überschreibt spezifische Werte