; ============================================================
; RobotDyn UNO+WiFi R3 — Door Firmware
; Zwei Plattformen: ATmega328P (I/O-Expander) + ESP8266 (Logik)
;
; DIP-Schalter:
;   ATmega flashen (1x einmalig):  SW3+SW4 ON, Rest OFF
;   ESP8266 flashen (1x einmalig): SW5+SW6+SW7 ON, Rest OFF
;   Normal-Betrieb (ATmega↔ESP):   SW1+SW2 ON, Rest OFF
; ============================================================

[platformio]
; src_dir = . ermöglicht build_src_filter pro Environment
src_dir       = .
default_envs  = door_01_esp_ota
extra_configs = platformio.secrets.ini

; ─────────────────────────────────────────────────────────
; ATmega328P Base
; Einmalig per USB flashen, danach nicht mehr anfassen.
; ─────────────────────────────────────────────────────────
[env_base_atmega]
platform         = atmelavr
board            = uno
framework        = arduino
build_src_filter = -<*> +<src_atmega/>
build_flags      = -Isrc_atmega
monitor_speed    = 9600
upload_speed     = 57600
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.11
    waspinator/AccelStepper @ ^1.64

; ─────────────────────────────────────────────────────────
; ESP8266 Base
; Enthält State Machine, WiFi, OTA, mDNS, HTTP.
; ─────────────────────────────────────────────────────────
[env_base_esp]
platform         = espressif8266
board            = esp12e
framework        = arduino
build_src_filter = -<*> +<src_esp/>
build_flags =
    -Isrc_esp
    -DSERVER_IP=\"${secrets.server_ip}\"
    -DAUTHENTICATION_TOKEN=\"${secrets.auth_token}\"
monitor_speed = 115200
lib_deps =
    jandrassy/TelnetStream @ ~1.2.0

; ─────────────────────────────────────────────────────────
; Door-01 Pair
; ─────────────────────────────────────────────────────────
[pair_door_01]
extends = env_base_esp
build_flags =
    ${env_base_esp.build_flags}
    -DOTA_HOSTNAME=\"tuer-01\"

[pair_door_02]
extends = env_base_esp
build_flags =
    ${env_base_esp.build_flags}
    -DOTA_HOSTNAME=\"tuer-02\"

; ─────────────────────────────────────────────────────────
; Konkrete Environments
; ─────────────────────────────────────────────────────────

; ATmega: einmalig per USB (DIP SW1+SW2)
[env:door_01_atmega_usb]
extends = env_base_atmega

[env:door_02_atmega_usb]
extends = env_base_atmega

; ESP8266: einmalig per USB (DIP SW3-SW6) — danach OTA
; Monitor: DIP SW5+SW6 ON (Connect-Modus), 9600 Baud
[env:door_01_esp_usb]
extends       = pair_door_01
monitor_speed = 9600

[env:door_02_esp_usb]
extends       = pair_door_02
monitor_speed = 9600

; ESP8266: OTA via mDNS-Hostname (kein DIP-Wechsel nötig)
; Monitor via Telnet: pio device monitor -e door_01_esp_ota
[env:door_01_esp_ota]
extends         = pair_door_01
upload_protocol = espota
upload_port     = tuer-01.local
monitor_port    = socket://tuer-01.local:23
extra_scripts   = resolve_mdns.py

[env:door_02_esp_ota]
extends         = pair_door_02
upload_protocol = espota
upload_port     = tuer-02.local
monitor_port    = socket://tuer-02.local:23
extra_scripts   = resolve_mdns.py
