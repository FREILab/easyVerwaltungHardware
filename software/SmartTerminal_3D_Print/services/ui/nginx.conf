# Touch-UI (Kiosk) + interner API-Proxy
# Docker DNS (127.0.0.11) dynamisch auflösen, damit Backend-Restarts/OTA-Updates
# niemals zu veralteten Upstream-IPs (502) führen.

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 250m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}

# PrusaLink-Emulation: ein Port pro Drucker-Slot (8101..8104)
server {
    listen 8101;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 250m;

    location / {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Printer-Slot 1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }
}

