<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SmartTerminal 3D-Print</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Top Bar: Terminal Title + 4 Printer Status Tiles + Account Button -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-dot" id="conn-dot" title="Backend-Verbindung"></div>
        <div>
          <div class="brand-title" id="service-name">3D-Print Terminal</div>
          <div class="brand-sub" id="clock">--:--</div>
        </div>
      </div>

      <div class="printer-bar" id="printer-bar">
        <!-- Populated dynamically -->
      </div>

      <button class="btn btn-secondary btn-account" id="btn-open-account" type="button">
        <span>Konto &amp; Guthaben</span>
      </button>
    </header>

    <!-- Main Queue View -->
    <main class="queue-area">
      <div class="queue-header">
        <h1>Druck-Warteschlange</h1>
        <span class="queue-hint">Jobs verfallen automatisch nach 5 Minuten</span>
      </div>

      <div id="queue-list" class="queue-list"></div>

      <div id="queue-empty" class="queue-empty hidden">
        <div class="empty-icon">🖨️</div>
        <h2>Keine Druckjobs in der Warteschlange</h2>
        <p>Sende deinen Job aus dem <strong>PrusaSlicer</strong> an Slot 1–4 (<code>:8101</code>–<code>:8104</code>).<br>
        Er erscheint hier automatisch innerhalb weniger Sekunden.</p>
      </div>
    </main>

    <!-- Collapsible Dev/Mock Simulator Bar (only rendered in mock mode) -->
    <footer id="dev-bar" class="dev-bar hidden">
      <span class="dev-badge">DEV MOCK</span>
      <button type="button" class="dev-btn" id="dev-upload">+ Test-Job (Slot 1)</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD01">Karte: Marius (25€)</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD02">Karte: Erika (0,15€)</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD03">Karte: Ohne Freigabe</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD99">Karte: BV / Einweiser</button>
      <button type="button" class="dev-btn" id="dev-toggle-p1">Drucker 1: Frei/Belegt</button>
      <span class="dev-hint">PIN: 1234</span>
    </footer>
  </div>

  <!-- Fullscreen Modal Overlay for Interactive Flows -->
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal" id="modal-box">
      <div class="modal-header">
        <div class="modal-header-left">
          <button type="button" class="modal-close-btn" id="modal-close" aria-label="Schließen">✕</button>
          <h2 id="modal-title">Titel</h2>
        </div>
        <div class="timeout-ring hidden" id="timeout-ring">
          <svg viewBox="0 0 44 44">
            <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
            <circle class="ring-fg" id="ring-fg" cx="22" cy="22" r="19"></circle>
          </svg>
          <span id="ring-text">60</span>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Banner for Short Status Messages -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
