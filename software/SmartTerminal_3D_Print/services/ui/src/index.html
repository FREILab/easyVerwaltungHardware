<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>SmartTerminal 3D-Print</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hmi-root" id="hmi-root">
    <!-- 1. Top Statusleiste: ‹ Zurück, Titel, Live-Uhr, 👁 Theme, 👤 Konto, ⚙ Setup -->
    <header class="statusbar">
      <div class="sb-left">
        <button type="button" class="back-top-btn hidden" id="btn-back-top" aria-label="Zurück">‹ Zurück</button>
        <span class="conn-dot" id="conn-dot" title="Backend-Verbindung"></span>
        <span class="sb-title" id="sb-title">Warteschlange</span>
        <span class="sb-sub" id="sb-sub"></span>
      </div>
      <div class="sb-right">
        <span class="sb-clock" id="sb-clock">--:--</span>
        <button type="button" class="sb-icon-btn" id="btn-theme-eye" title="Hell / Dunkel umschalten">👁</button>
        <button type="button" class="sb-account-btn" id="btn-account">👤 Konto</button>
        <button type="button" class="sb-icon-btn" id="btn-setup" title="Setup &amp; Einstellungen">⚙</button>
      </div>
    </header>

    <!-- 2. Hauptbereich (Warteschlange oder Vollbild-Workflow-Screen) -->
    <main class="stage" id="stage"></main>

    <!-- 3. Bottom Drucker-Dock (klickbare Drucker-Tasten) -->
    <footer class="printer-dock" id="printer-dock"></footer>

    <!-- 4. Upload-Detail-Popup (öffnet beim Tippen auf laufenden Upload) -->
    <div class="popup-backdrop hidden" id="upload-popup" role="dialog" aria-modal="true"></div>

    <!-- 5. Drucker-Detail-Popup (öffnet beim Tippen auf Drucker-Kachel unten) -->
    <div class="popup-backdrop hidden" id="printer-popup" role="dialog" aria-modal="true"></div>

    <!-- 5b. Kurzes Erfolgs-Popup nach abgeschlossener Übertragung (4 s → automatisch Home) -->
    <div class="popup-backdrop hidden" id="done-popup" role="dialog" aria-modal="true"></div>

    <!-- 6. Einklappbarer DEV-Simulator (nur sichtbar wenn Backend im Mock-Modus) -->
    <button type="button" class="dev-pill hidden" id="dev-pill">DEV</button>
    <div class="dev-drawer hidden" id="dev-drawer">
      <button type="button" class="dev-btn" id="dev-upload">+ Test-Job</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD01">Marius (25€)</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD02">Erika (0,15€)</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD03">Ohne Freigabe</button>
      <button type="button" class="dev-btn" data-rfid="04AABBCCDD99">BV-Karte</button>
      <button type="button" class="dev-btn" id="dev-toggle-p1">Drucker 1: Frei/Belegt</button>
      <span class="dev-hint">PIN 1234</span>
      <button type="button" class="dev-btn" id="dev-close">✕</button>
    </div>

    <!-- 7. Toast -->
    <div class="toast hidden" id="toast"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
