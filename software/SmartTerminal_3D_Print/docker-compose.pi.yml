# Raspberry Pi 5 Hardware-Overlay (Produktion & Hardware-Test auf dem Pi).
# Start: docker compose -f docker-compose.yml -f docker-compose.pi.yml up -d

services:

  device-agent:
    environment:
      HARDWARE_MODE: pi
    devices:
      - /dev/spidev0.0:/dev/spidev0.0   # PN532 NFC/RFID (SPI)
      - /dev/gpiochip0:/dev/gpiochip0   # Buzzer, WS2812 / GPIO
      - /dev/i2c-1:/dev/i2c-1           # Optionale I2C-Peripherie
    volumes:
      - /sys/class/backlight:/sys/class/backlight   # Waveshare DSI Hardware-Backlight (0-255)
